name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'helm/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'helm/**'
  workflow_dispatch:

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'renovate/')
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'arc-preparr' }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: Set deployment variables
        run: |
          echo "IMAGE_REPOSITORY=preparr-e2e/preparr" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "RELEASE_NAME=preparr-e2e" >> $GITHUB_ENV
          echo "NAMESPACE=preparr-test" >> $GITHUB_ENV
          echo "KIND_CLUSTER=preparr-e2e" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install

      - name: Build PrepArr
        run: bun run build

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          wait: 180s

      - name: Build PrepArr image and load into kind
        run: |
          docker build -t ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          kind load docker-image ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }} --name ${{ env.KIND_CLUSTER }}

      - name: Build E2E runner image and load into kind
        run: |
          # The E2E suite talks to services over in-cluster DNS, so it runs as a Job inside kind
          ctx=$(mktemp -d)
          mkdir -p "$ctx/tests"
          cp -r tests/e2e "$ctx/tests/e2e"
          cp package.json "$ctx/"
          cp "$(command -v kubectl)" "$ctx/kubectl"
          cat > "$ctx/Dockerfile" <<'EOF'
          FROM oven/bun:1-alpine
          WORKDIR /app
          COPY package.json ./
          COPY tests ./tests
          COPY kubectl /usr/local/bin/kubectl
          CMD ["bun", "run", "test:e2e"]
          EOF
          docker build -t preparr-e2e/runner:${{ env.IMAGE_TAG }} "$ctx"
          kind load docker-image preparr-e2e/runner:${{ env.IMAGE_TAG }} --name ${{ env.KIND_CLUSTER }}

      - name: Deploy stack via Helm
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ./helm/preparr \
            -f helm/preparr/values-e2e.yaml \
            --set preparr.image.repository=${{ env.IMAGE_REPOSITORY }} \
            --set preparr.image.tag=${{ env.IMAGE_TAG }} \
            --set preparr.image.pullPolicy=IfNotPresent \
            --set global.namespace=${{ env.NAMESPACE }} \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --wait \
            --timeout 25m
          echo "Helm deployment completed. Current pod status:"
          kubectl get pods -n ${{ env.NAMESPACE }}

      - name: Wait for all pods ready
        run: |
          echo "Waiting for PostgreSQL..."
          kubectl wait --for=condition=ready pod -l app=postgres --field-selector=status.phase=Running -n ${{ env.NAMESPACE }} --timeout=120s

          echo "Waiting for qBittorrent..."
          kubectl wait --for=condition=ready pod -l app=qbittorrent --field-selector=status.phase=Running -n ${{ env.NAMESPACE }} --timeout=120s

          echo "Waiting for Prowlarr..."
          kubectl wait --for=condition=ready pod -l app=prowlarr --field-selector=status.phase=Running -n ${{ env.NAMESPACE }} --timeout=180s

          echo "Waiting for Sonarr..."
          kubectl wait --for=condition=ready pod -l app=sonarr --field-selector=status.phase=Running -n ${{ env.NAMESPACE }} --timeout=180s

          echo "Waiting for Radarr..."
          kubectl wait --for=condition=ready pod -l app=radarr --field-selector=status.phase=Running -n ${{ env.NAMESPACE }} --timeout=180s

          echo "Waiting for Bazarr..."
          kubectl wait --for=condition=ready pod -l app=bazarr --field-selector=status.phase=Running -n ${{ env.NAMESPACE }} --timeout=120s

          echo "All pods ready"

      - name: Run E2E tests
        run: |
          kubectl create serviceaccount e2e-runner -n ${{ env.NAMESPACE }}
          kubectl create clusterrolebinding e2e-runner --clusterrole=cluster-admin --serviceaccount=${{ env.NAMESPACE }}:e2e-runner
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: e2e-runner
            namespace: ${{ env.NAMESPACE }}
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 1500
            template:
              spec:
                serviceAccountName: e2e-runner
                restartPolicy: Never
                containers:
                  - name: e2e
                    image: preparr-e2e/runner:${{ env.IMAGE_TAG }}
                    imagePullPolicy: Never
                    env:
                      - name: E2E_NAMESPACE
                        value: ${{ env.NAMESPACE }}
          EOF
          until kubectl get pod -l job-name=e2e-runner -n ${{ env.NAMESPACE }} -o name | grep -q .; do sleep 2; done
          kubectl wait --for=condition=ready pod -l job-name=e2e-runner -n ${{ env.NAMESPACE }} --timeout=120s || true
          kubectl logs -f job/e2e-runner -n ${{ env.NAMESPACE }} || true
          until status=$(kubectl get job e2e-runner -n ${{ env.NAMESPACE }} -o jsonpath='{.status.succeeded}{.status.failed}'); [ -n "$status" ]; do sleep 5; done
          kubectl logs job/e2e-runner -n ${{ env.NAMESPACE }} --tail=20 || true
          [ "$(kubectl get job e2e-runner -n ${{ env.NAMESPACE }} -o jsonpath='{.status.succeeded}')" = "1" ]

      - name: Collect logs on failure
        if: failure()
        run: |
          # Printed to the job log; CI must not upload Actions artifacts
          for app in sonarr radarr prowlarr bazarr; do
            for c in preparr-init preparr-sidecar $app; do
              echo "::group::$app / $c"
              kubectl logs -n ${{ env.NAMESPACE }} -l app=$app -c $c --tail=300 2>&1 || true
              echo "::endgroup::"
            done
          done
          for target in "app=postgres" "app=qbittorrent -c preparr-init" "app=qbittorrent -c qbittorrent"; do
            echo "::group::$target"
            kubectl logs -n ${{ env.NAMESPACE }} -l $target --tail=200 2>&1 || true
            echo "::endgroup::"
          done
          echo "::group::pod descriptions"
          kubectl describe pods -n ${{ env.NAMESPACE }} 2>&1 || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' 2>&1 || true
          echo "::endgroup::"

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name ${{ env.KIND_CLUSTER }} || true
