[test]
# Quiet the JSON logger during tests; set LOG_LEVEL explicitly to see logs
preload = ["./src/test/setup.ts"]

# bun fmt settings. bun fmt runs through the pinned canary
# (bun@1.4.3-canary.20261014.1, see package.json); the Bun 1.4.3 runtime and
# tests ignore this section. Same options biome.json's formatter had.
[fmt]
printWidth = 100
tabWidth = 2
semi = false
singleQuote = true
trailingComma = "all"
arrowParens = "always"
endOfLine = "lf"
# Replaces Biome's organizeImports.
sortImports = true
sortPackageJson = true
# Biome's ignores, plus what Biome never formatted. CHANGELOG.md is written
# by semantic-release, and Helm templates are Go templates.
ignorePatterns = [
  "dist/**",
  "coverage/**",
  "docs/**",
  ".claude/**",
  "**/*.log",
  "**/*.lock",
  "**/*.min.js",
  "helm/**/templates/**",
  "**/*.md",
  "**/*.mdx",
  "**/*.html",
  "**/*.yml",
  "**/*.yaml",
  "**/*.toml",
]

# bun lint settings, also run through the pinned canary. [lint.rules] turns on
# every rule Biome ran (biome rage --linter) that bun lint has with the same
# logic. What bun lint lacks, or does differently, stays in biome.json; the
# bun twins of those are off so nothing reports twice. The mapping table is
# in the PR that added this section. No rule here needs type information, so
# a run stays fast.
[lint]
ignorePatterns = ["dist/**", "coverage/**", "docs/**", ".claude/**", "**/*.min.js"]

[lint.rules]
# Biome had noConsole as a warning, and off for the files in the override below.
"eslint/no-console" = "warn"
# Biome's noDoubleEquals allows == null.
"eslint/eqeqeq" = ["error", "always", { null = "ignore" }]
# Biome's noInvalidUseBeforeDeclaration only flags invalid uses.
"eslint/no-use-before-define" = [
  "error",
  { functions = false, classes = false, variables = false, typedefs = false },
]
# Biome's useImportType allows import("x").T annotations.
"typescript/consistent-type-imports" = ["error", { disallowTypeAnnotations = false }]
"eslint/prefer-arrow-callback" = ["error", { allowNamedFunctions = true }]
"eslint/array-callback-return" = "error"
"eslint/constructor-super" = "error"
"eslint/default-case-last" = "error"
